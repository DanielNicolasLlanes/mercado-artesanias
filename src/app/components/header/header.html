<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo Crema -->
  <rect width="100%" height="100%" fill="#F9EFE6"/>
  
  <!-- Isotipo: Trazo orgánico continuo M + A -->
  <g transform="translate(0, -20)">
    <path d="M180,240 C180,160 210,140 225,140 C245,140 250,190 250,240 C250,180 260,140 275,140 C290,140 320,160 320,240 M210,210 C240,205 260,205 290,210" 
          fill="none" stroke="#96482E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pequeño punto orgánico que equilibra el diseño -->
    <circle cx="250" cy="115" r="5" fill="#96482E"/>
  </g>
  
  <!-- Tipografía -->
  <text x="250" y="360" font-family="'Lato', 'Helvetica', sans-serif" font-size="30" font-weight="300" fill="#96482E" text-anchor="middle" letter-spacing="8">MERCADO</text>
  <text x="250" y="400" font-family="'Lato', 'Helvetica', sans-serif" font-size="15" font-weight="700" fill="#96482E" text-anchor="middle" letter-spacing="10">ARTESANÍAS</text>
</svg>

<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo Crema -->
  <rect width="100%" height="100%" fill="#F9EFE6"/>
  
  <g transform="translate(0, -20)">
    <!-- Círculo Terracota -->
    <circle cx="250" cy="200" r="90" fill="#96482E"/>
    
    <!-- Silueta Calada de la Vasija (en color Crema) -->
    <path d="M230,150 C230,135 270,135 270,150 C270,165 285,175 285,200 C285,230 265,245 250,245 C235,245 215,230 215,200 C215,175 230,165 230,150 Z" fill="#F9EFE6"/>
    <!-- Detalles de manufactura/línea fina -->
    <path d="M225,200 Q250,205 275,200" fill="none" stroke="#96482E" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Tipografía -->
  <text x="250" y="360" font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" font-size="32" font-weight="700" fill="#96482E" text-anchor="middle" letter-spacing="6">MERCADO</text>
  <text x="250" y="400" font-family="'Montserrat', 'Helvetica', 'Arial', sans-serif" font-size="16" font-weight="400" fill="#96482E" text-anchor="middle" letter-spacing="12">ARTESANÍAS</text>
</svg>

<svg xmlns="http://w3.org" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo Crema -->
  <rect width="100%" height="100%" fill="#F9EFE6"/>
  
  <g transform="translate(0, -10)">
    <!-- Arco de medio punto exterior -->
    <path d="M190,260 V170 A60,60 0 0,1 310,170 V260" fill="none" stroke="#96482E" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Líneas cruzadas internas formando la M estilizada -->
    <path d="M205,260 L250,165 L295,260" fill="none" stroke="#96482E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M225,260 L250,200 L275,260" fill="none" stroke="#96482E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Tipografía -->
  <text x="250" y="360" font-family="'Playfair Display', 'Georgia', serif" font-size="34" font-weight="600" fill="#96482E" text-anchor="middle" letter-spacing="4">MERCADO</text>
  <text x="250" y="400" font-family="'Playfair Display', 'Georgia', serif" font-size="14" font-style="italic" fill="#96482E" text-anchor="middle" letter-spacing="8">Artesanías</text>
</svg>
